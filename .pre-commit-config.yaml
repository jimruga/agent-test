# Secret-scanning backstop. Install once per clone:
#   pip install pre-commit && pre-commit install
# Thereafter gitleaks runs automatically on every `git commit` and blocks the
# commit if it finds a secret. To bypass in a true emergency: SKIP=gitleaks git commit ...
# (but the rule stands: secrets/keys belong in the AWS key store, never in git.)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
