# Manually-triggered maintenance workflow: regenerate package-lock.json on LINUX.
#
# Why: the lockfile must contain the linux-x64 native optional deps the CI runners
# need (npm/cli#4828). Devs on macOS with no Docker/linux cannot produce that lock
# locally. Trigger this from the Actions tab on the feature branch; it regenerates
# the lock on ubuntu with the pinned npm, PROVES it is cross-platform-correct, and
# uploads it as a downloadable artifact. Download it, drop it in at the repo root,
# commit it with the manifests, push. No local linux/docker required.
#
# Default is ARTIFACT ONLY (permissions: contents: read — no token/push concerns).
# An optional commit-back path is described in workspace/ci-toolchain-fix.md.
name: regen-lockfile

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to regenerate the lock on"
        required: true
        default: "feature/s0-s1-foundation-auth"

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate linux-correct lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Same pinned resolver as CI + the packageManager field — identical everywhere.
      - name: Pin npm (match packageManager)
        run: npm i -g npm@10.9.3 && npm --version
      - name: Regenerate the lockfile from the committed manifests (linux-x64)
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --no-audit --no-fund   # NO package arg — regenerates the lock only
      - name: Prove the lock is cross-platform-correct (same checks as lockfile-guard)
        run: |
          set -euo pipefail
          f=package-lock.json
          [ -f "$f" ] || { echo "::error::no package-lock.json was produced"; exit 1; }
          grep -q "\"node_modules/@biomejs/cli-linux-x64\"" "$f" \
            || { echo "::error::regenerated lock is MISSING @biomejs/cli-linux-x64"; exit 1; }
          if grep -q '@rolldown/binding' "$f"; then
            echo "::error::regenerated lock contains @rolldown/binding — a manifest still pulls vite 8. Fix the manifests on '${{ github.event.inputs.ref }}' before regenerating."
            exit 1
          fi
          echo "OK: linux-x64 native deps present, no rolldown."
      - name: Prove npm ci accepts the regenerated lock (the real gate)
        run: npm ci --no-audit --no-fund
      - name: Upload the regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-linux
          path: package-lock.json
          retention-days: 7
          if-no-files-found: error
