# Server-side verification gate. These checks run where agents have no write
# access; branch protection (scripts/setup-branch-protection.sh) makes them
# binding, so a red or unreviewed PR cannot be merged no matter what an agent
# claims. The `all-green` job is the single required status check.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # required for org accounts

  verify:
    name: Verify (lint · typecheck · test · coverage · anti-tamper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history so the tamper diff has a base
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      # Pin npm to the SAME resolver the lockfile was generated with
      # (root package.json "packageManager"). Generating and consuming the lock
      # with one npm version is what stops the darwin/linux drift (npm/cli#4828).
      - name: Pin npm (match packageManager)
        run: npm i -g npm@12.0.1 && npm --version
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Resolve diff base
        run: echo "VERIFY_BASE=origin/${{ github.base_ref || github.event.repository.default_branch || 'main' }}" >> "$GITHUB_ENV"
      - name: Run verification (single source of truth)
        env:
          VERIFY_MODE: full
          MIN_COVERAGE: "80"
        run: ./verify.sh

  migrations:
    name: Migrations apply + rollback (ephemeral DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no relational migrations
        id: gate
        run: |
          if [ -d migrations ] && ls migrations/* >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No migrations/ — nothing to apply (e.g. DynamoDB feature)."; fi
      # Proves the migration actually applies AND rolls back — not that an agent
      # said it would. Replace the two commands with your migration runner
      # (e.g. npm run migrate:up / migrate:down, alembic upgrade/downgrade, sqitch).
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: "26" }
      - name: Pin npm (match packageManager)
        if: steps.gate.outputs.run == 'true'
        run: npm i -g npm@12.0.1 && npm --version
      - name: Apply then roll back (Knex; migrations owned by data-engineer)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -e
          npm ci --no-audit --no-fund
          # Fails the job if EITHER direction errors (proves a true inverse `down`).
          npm --workspace @repo/api run migrate:up
          npm --workspace @repo/api run migrate:down

  integration:
    name: Integration (repositories vs ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no relational migrations
        id: gate
        run: |
          if [ -d migrations ] && ls migrations/* >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT";
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No migrations/ — no relational integration lane."; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: "26" }
      - name: Pin npm (match packageManager)
        if: steps.gate.outputs.run == 'true'
        run: npm i -g npm@12.0.1 && npm --version
      # Apply the real schema, then exercise the production repository adapters
      # (KnexUserRepository, ...) against it — the code the no-DB unit lane can't
      # cover (review W4). Proves the SQL, not just the in-memory fake.
      - name: Apply migrations then run repository integration tests
        if: steps.gate.outputs.run == 'true'
        run: |
          set -e
          npm ci --no-audit --no-fund
          npm --workspace @repo/api run migrate:up
          npm --workspace @repo/api run test:integration

  sca:
    name: Dependency scan + SBOM (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      - name: Pin npm (match packageManager)
        run: npm i -g npm@12.0.1 && npm --version
      - name: npm audit (fail on high/critical)
        run: |
          # Single lockfile at the workspace root (apps/*, packages/*).
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
            npm audit --audit-level=high
          else
            echo "no root package-lock.json yet"
          fi
      - name: pip-audit (if python present)
        run: |
          if ls **/requirements*.txt >/dev/null 2>&1; then
            pip install pip-audit >/dev/null && pip-audit -r $(ls **/requirements*.txt | head -1) || exit 1
          else echo "no python deps"; fi
      # SBOM: generate a CycloneDX/Syft SBOM and upload as an artifact for audit.
      # Replace with your SBOM tool (e.g. anchore/sbom-action or cyclonedx).
      - name: SBOM (placeholder)
        run: |
          echo "TODO generate + upload SBOM (anchore/sbom-action or cyclonedx-cli)"

  lockfile-guard:
    name: Lockfile cross-platform guard
    runs-on: ubuntu-latest
    # Turns the "works on my Mac" lockfile bug (npm/cli#4828) into a fast, clear,
    # BINDING failure instead of a cryptic `npm ci` "missing X from lock" cascade.
    # A lock generated on darwin can omit the linux-x64 native optional deps that
    # the linux CI runners need; this job asserts they are present before merge.
    steps:
      - uses: actions/checkout@v4
      - name: Assert the committed lock contains the linux-x64 native deps CI needs
        run: |
          set -euo pipefail
          f=package-lock.json
          [ -f "$f" ] || { echo "::error::no root package-lock.json committed"; exit 1; }
          rc=0
          # Native optional deps that MUST be present for the linux-x64 CI runners.
          # (Pinned toolchain: biome 1.9.4 ships per-platform CLI binaries.)
          for pkg in "@biomejs/cli-linux-x64"; do
            if ! grep -q "\"node_modules/$pkg\"" "$f"; then
              echo "::error::package-lock.json is MISSING $pkg (linux-x64 native binary)."
              echo "::error::This lock was generated on a non-linux host (npm/cli#4828). Regenerate it on linux (docker run node:26 ...) per the CI toolchain runbook (workspace/ci-toolchain-fix.md), then recommit."
              rc=1
            fi
          done
          # Regression guard: vite 8 pulls rolldown's per-platform native bindings,
          # which is exactly what re-introduces the cross-platform lock breakage.
          # The pinned toolchain is vite 5.4 (esbuild/rollup, no rolldown).
          if grep -q '@rolldown/binding' "$f"; then
            echo "::error::package-lock.json contains @rolldown/binding — vite 8 crept back in. The pinned toolchain is vite 5.4.x (no rolldown). Do NOT upgrade vite past 5.x without re-solving the cross-platform lockfile."
            rc=1
          fi
          if [ "$rc" = 0 ]; then echo "Lockfile cross-platform guard: OK (linux-x64 native deps present, no rolldown)"; fi
          exit $rc

  all-green:
    name: all-green
    needs: [secret-scan, verify, migrations, integration, sca, lockfile-guard]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."

  # ── DevOps adds deploy/smoke jobs here (post-deploy health check proves a
  #    deploy is live; see devops-engineer.md). Deploy jobs require the
  #    environment's own approval, separate from PR merge. ──
