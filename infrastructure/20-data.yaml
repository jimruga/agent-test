AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Team To-Do App - data layer. KMS CMK (rotation on), RDS Postgres (F6: encrypted
  at rest + private + PITR + Multi-AZ prod), ElastiCache Redis (F5: TLS in transit
  + KMS at rest + private), and Secrets Manager secrets referenced BY ARN by the
  app (F4/F7). No secret VALUES appear in this template - RDS/Redis credentials are
  generated by Secrets Manager and never printed.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
  DbAllocatedStorage:
    Type: Number
    Default: 20
  RedisNodeType:
    Type: String
    Default: cache.t4g.small
  # JWKS is public; the ONLY secrets are the OAuth client secret + session pepper +
  # DB creds + Redis auth token. Values are seeded out-of-band (see deploy plan),
  # NOT in this template.

Conditions:
  IsProd: !Equals [!Ref Environment, production]

Resources:
  # --- KMS CMK: one key encrypts RDS, ElastiCache, and Secrets (F5/F6). ---
  DataKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "ttd-${Environment} data-at-rest CMK (RDS, ElastiCache, Secrets)"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
  DataKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/ttd-${Environment}-data"
      TargetKeyId: !Ref DataKmsKey

  # --- Secrets (referenced by ARN by the app; least-priv IAM in 30-compute) ---
  # RDS master credential is generated + owned by Secrets Manager (never printed).
  DbMasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/db/master"
      Description: RDS master credential (Secrets Manager managed rotation)
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ttd_master"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # app_runtime / app_migrator role passwords (F7). The ROLES are created by
  # bootstrap-db-roles.sql; these secrets hold their credentials for the app +
  # migration runner. Generated here; never printed.
  DbRuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/db/app_runtime"
      Description: app_runtime DML-only role credential (non-BYPASSRLS)
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"app_runtime"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  DbMigratorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/db/app_migrator"
      Description: app_migrator DDL role credential (migration runner only)
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"app_migrator"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  RedisAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/redis/auth-token"
      Description: ElastiCache Redis AUTH token
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # OAuth client secret + session pepper: created as EMPTY placeholders here so the
  # ARNs are stable and referenceable; the real VALUES are put with the AWS CLI
  # out-of-band (deploy plan step S2) so they never touch git or this template.
  OAuthClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/oauth/google-client-secret"
      Description: Google OAuth client secret (value seeded out-of-band)
      KmsKeyId: !Ref DataKmsKey
  SessionPepperSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ttd/${Environment}/session/pepper"
      Description: Session signing pepper (value seeded out-of-band)
      KmsKeyId: !Ref DataKmsKey

  # --- RDS Postgres (F6) ---
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "ttd-${Environment} data subnets"
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "ttd-${Environment}-DataSubnets" }]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "ttd-${Environment}-pg"
      Engine: postgres
      EngineVersion: "16.4"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true                     # F6 encryption at rest
      KmsKeyId: !Ref DataKmsKey                   # F6 KMS
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbMasterSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [{ "Fn::ImportValue": !Sub "ttd-${Environment}-DbSgId" }]
      PubliclyAccessible: false                   # F6 no public endpoint
      MultiAZ: !If [IsProd, true, false]
      BackupRetentionPeriod: !If [IsProd, 14, 7]  # PITR window (RPO)
      PreferredBackupWindow: "07:00-07:30"
      DeletionProtection: !If [IsProd, true, false]
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !Ref DataKmsKey
      EnableCloudwatchLogsExports: [postgresql]

  # --- ElastiCache Redis (F5) ---
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub "ttd-${Environment} redis data subnets"
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "ttd-${Environment}-DataSubnets" }]
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "ttd-${Environment}-redis"
      ReplicationGroupDescription: !Sub "ttd-${Environment} session store"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumNodeGroups: 1
      ReplicasPerNodeGroup: !If [IsProd, 1, 0]
      AutomaticFailoverEnabled: !If [IsProd, true, false]
      MultiAZEnabled: !If [IsProd, true, false]
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds: [{ "Fn::ImportValue": !Sub "ttd-${Environment}-RedisSgId" }]
      TransitEncryptionEnabled: true              # F5 TLS in transit (rediss://)
      AtRestEncryptionEnabled: true               # F5 at rest
      KmsKeyId: !Ref DataKmsKey                    # F5 KMS
      AuthToken: !Sub "{{resolve:secretsmanager:${RedisAuthSecret}}}"
      SnapshotRetentionLimit: !If [IsProd, 7, 1]

Outputs:
  KmsKeyArn:
    Value: !GetAtt DataKmsKey.Arn
    Export: { Name: !Sub "ttd-${Environment}-KmsKeyArn" }
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "ttd-${Environment}-DbEndpoint" }
  RedisPrimaryEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export: { Name: !Sub "ttd-${Environment}-RedisEndpoint" }
  OAuthClientSecretArn:
    Value: !Ref OAuthClientSecret
    Export: { Name: !Sub "ttd-${Environment}-OAuthClientSecretArn" }
  SessionPepperArn:
    Value: !Ref SessionPepperSecret
    Export: { Name: !Sub "ttd-${Environment}-SessionPepperArn" }
  DbRuntimeSecretArn:
    Value: !Ref DbRuntimeSecret
    Export: { Name: !Sub "ttd-${Environment}-DbRuntimeSecretArn" }
  DbMigratorSecretArn:
    Value: !Ref DbMigratorSecret
    Export: { Name: !Sub "ttd-${Environment}-DbMigratorSecretArn" }
  RedisAuthSecretArn:
    Value: !Ref RedisAuthSecret
    Export: { Name: !Sub "ttd-${Environment}-RedisAuthSecretArn" }
